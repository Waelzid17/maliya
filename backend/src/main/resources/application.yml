server:
  port: 8080

spring:
  application:
    name: maliya-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/maliya}
    username: ${DB_USER:maliya}
    password: ${DB_PASSWORD:maliya}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # le schéma appartient à Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    # db/demo contient 18 mois de données fictives. Pour démarrer à vide : FLYWAY_LOCATIONS=classpath:db/migration
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}
  jackson:
    default-property-inclusion: always

maliya:
  # Adresse du service IA (FastAPI)
  ia-url: ${IA_URL:http://localhost:8000}
  # Date « d'aujourd'hui ». Vide = date réelle. Le mode démo la fige sur la fin des données.
  date-reference: ${MALIYA_AUJOURDHUI:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
