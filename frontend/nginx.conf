server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # L'API (et l'IA derrière elle) passe par le backend Spring Boot
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Application React : toutes les autres routes servent index.html
    location / {
        try_files $uri /index.html;
    }
}
